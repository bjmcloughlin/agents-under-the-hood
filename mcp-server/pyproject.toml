[project]
name = "books-mcp"
version = "0.1.0"
description = "A small MCP server over the Open Library API, built to teach the layout"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "requests>=2.32",
]

[project.scripts]
books-mcp = "books_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/books_mcp"]
